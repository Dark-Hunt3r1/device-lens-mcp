name: Build and attest release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-attest-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          package_text = pathlib.Path("src/device_lens_mcp/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)["\x27]', package_text, re.MULTILINE)
          package_version = match.group(1) if match else None
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{expected}" or package_version != expected:
              sys.exit(f"Version mismatch: tag={tag!r}, pyproject={expected!r}, package={package_version!r}")
          print(f"Release version verified: {tag}")
          PY

      - name: Build wheel and source archive
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Generate signed GitHub build attestation
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: "dist/*"

      - name: Upload attested files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
