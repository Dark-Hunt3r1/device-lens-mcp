[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "device-lens-mcp"
version = "0.6.0"
description = "A detection-first Windows MCP server that turns Device Manager records into understandable physical-device groups."
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Mitch" },
]
keywords = ["mcp", "windows", "device-manager", "drivers", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "mcp>=1.12.4,<2",
    "pydantic>=2.7.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Dark-Hunt3r1/device-lens-mcp"
Repository = "https://github.com/Dark-Hunt3r1/device-lens-mcp"
Issues = "https://github.com/Dark-Hunt3r1/device-lens-mcp/issues"
Documentation = "https://github.com/Dark-Hunt3r1/device-lens-mcp#readme"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.0.0",
]

[project.scripts]
device-lens-mcp = "device_lens_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
